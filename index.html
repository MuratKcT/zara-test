<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zara Webhook Tester</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f8fafc;
      margin-bottom: 1.5rem;
      letter-spacing: -.02em;
    }
    h1 em { color: #818cf8; font-style: normal; }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      max-width: 1100px;
    }
    @media (max-width: 860px) { .layout { grid-template-columns: 1fr; } }

    /* ── Cards ── */
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.5rem;
    }
    .card-title {
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748b;
      margin-bottom: 1.25rem;
    }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: .75rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: .35rem;
      letter-spacing: .04em;
    }
    input, textarea {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #e2e8f0;
      padding: .6rem .8rem;
      font-size: .9rem;
      font-family: inherit;
      margin-bottom: 1rem;
      transition: border-color .15s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #818cf8;
    }
    textarea { min-height: 90px; resize: vertical; }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
    .row-2 input { margin-bottom: 0; }

    /* ── Drop zone ── */
    .drop {
      border: 2px dashed #334155;
      border-radius: 10px;
      padding: 1.25rem;
      text-align: center;
      cursor: pointer;
      margin-bottom: 1rem;
      transition: border-color .15s, background .15s;
      color: #475569;
      font-size: .85rem;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }
    .drop:hover, .drop.over { border-color: #818cf8; background: #1a2540; color: #818cf8; }
    .drop .icon { font-size: 1.5rem; line-height: 1; }
    .drop img { max-height: 140px; border-radius: 6px; margin-top: .4rem; }
    .drop small { color: #64748b; }

    /* ── Button ── */
    button {
      width: 100%;
      padding: .75rem;
      background: #4f46e5;
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background .15s, opacity .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
    }
    button:hover:not(:disabled) { background: #6366f1; }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    button.loading .spinner { display: block; }
    button.loading .btn-label { display: none; }

    /* ── Response panel ── */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      padding: .25rem .7rem;
      border-radius: 999px;
      font-size: .75rem;
      font-weight: 700;
      margin-bottom: .5rem;
    }
    .badge.ok  { background: #14532d; color: #86efac; }
    .badge.err { background: #7f1d1d; color: #fca5a5; }
    .meta { font-size: .75rem; color: #64748b; margin-bottom: 1rem; }

    /* Summary grid */
    .summary {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .4rem .75rem;
      font-size: .82rem;
      margin-bottom: 1.1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
    }
    .summary .full { grid-column: span 2; }
    .summary .key  { color: #64748b; }
    .summary .val  { color: #e2e8f0; font-weight: 500; word-break: break-word; }

    /* Generated image */
    .gen-image-wrap {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e293b;
    }
    .gen-image-wrap label { margin-bottom: .5rem; }
    .gen-image-wrap img {
      width: 100%;
      border-radius: 8px;
      display: block;
    }

    /* Raw JSON */
    .json-box {
      font-family: 'Courier New', monospace;
      font-size: .75rem;
      white-space: pre-wrap;
      word-break: break-all;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: .9rem;
      max-height: 420px;
      overflow-y: auto;
      color: #94a3b8;
    }

    .placeholder { color: #475569; font-size: .85rem; padding: .5rem 0; }
  </style>
</head>
<body>

<h1>Zara Webhook <em>Tester</em></h1>

<div class="layout">

  <!-- ── LEFT: Request ── -->
  <div class="card">
    <p class="card-title">Request</p>

    <label>Webhook URL</label>
    <input id="url" type="url" value="https://ai.vashausmishka.com/webhook/Zara">

    <label>Message</label>
    <textarea id="message" placeholder="Хочу красиву посмішку…">Хочу красиву посмішку, зуби жовтуваті та трохи криві</textarea>

    <div class="row-2" style="margin-bottom:1rem">
      <div>
        <label>Name</label>
        <input id="name" placeholder="Іванна Коваль">
      </div>
      <div>
        <label>Phone</label>
        <input id="phone" placeholder="+380991234567">
      </div>
    </div>

    <label>Email</label>
    <input id="email" type="email" placeholder="test@gmail.com">

    <label>Image (optional)</label>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      <span class="icon">🖼️</span>
      <span id="drop-label">Click or drag a JPEG / PNG here</span>
      <input type="file" id="file" accept="image/jpeg,image/png" style="display:none" onchange="handleFile(this.files[0])">
    </div>

    <button id="btn" onclick="send()">
      <span class="btn-label">Send to Zara</span>
      <span class="spinner"></span>
    </button>
  </div>

  <!-- ── RIGHT: Response ── -->
  <div class="card">
    <p class="card-title">Response</p>

    <div id="res-status"></div>

    <div id="res-summary" style="display:none">
      <div class="summary">
        <span class="key">Style</span>   <span class="val" id="r-style">—</span>
        <span class="key">Score</span>   <span class="val" id="r-score">—</span>
        <span class="key">Color</span>   <span class="val" id="r-color">—</span>
        <span class="key">Price</span>   <span class="val" id="r-price">—</span>
        <span class="key full">Services</span>  <span class="val full" id="r-services">—</span>
        <span class="key full">Doctors</span>   <span class="val full" id="r-doctors">—</span>
        <span class="key full">Duration</span>  <span class="val full" id="r-duration">—</span>
      </div>
    </div>

    <div id="res-image" style="display:none" class="gen-image-wrap">
      <label>AI-generated smile</label>
      <img id="gen-img" alt="AI smile">
    </div>

    <div id="res-json" class="json-box">
      <span class="placeholder">Response will appear here…</span>
    </div>
  </div>

</div>

<script>
  let imageBase64 = null;

  /* ── Drag & drop ── */
  const drop = document.getElementById('drop');
  drop.addEventListener('dragover',  e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', ()  => drop.classList.remove('over'));
  drop.addEventListener('drop',      e  => {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
  });

  function handleFile(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      const dataUrl = e.target.result;
      imageBase64 = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
      document.getElementById('drop').innerHTML =
        `<img src="${dataUrl}" alt="preview"><small>${file.name} · ${(file.size / 1024).toFixed(1)} KB</small>
         <input type="file" id="file" accept="image/jpeg,image/png" style="display:none" onchange="handleFile(this.files[0])">`;
    };
    reader.readAsDataURL(file);
  }

  /* ── Send ── */
  async function send() {
    const url     = document.getElementById('url').value.trim();
    const message = document.getElementById('message').value.trim();
    const name    = document.getElementById('name').value.trim();
    const phone   = document.getElementById('phone').value.trim();
    const email   = document.getElementById('email').value.trim();

    if (!url || !message) {
      alert('URL and Message are required.');
      return;
    }

    const payload = { message };
    if (name)        payload.name  = name;
    if (phone)       payload.phone = phone;
    if (email)       payload.email = email;
    if (imageBase64) payload.image = imageBase64;

    const btn = document.getElementById('btn');
    btn.disabled = true;
    btn.classList.add('loading');

    document.getElementById('res-status').innerHTML  = '';
    document.getElementById('res-summary').style.display = 'none';
    document.getElementById('res-image').style.display   = 'none';
    document.getElementById('res-json').innerHTML = '<span class="placeholder">Waiting…</span>';

    const t0 = Date.now();
    try {
      const res  = await fetch(url, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const ms  = Date.now() - t0;
      const ct  = res.headers.get('content-type') || '';
      const text = await res.text();

      /* Status badge */
      document.getElementById('res-status').innerHTML =
        `<span class="badge ${res.ok ? 'ok' : 'err'}">${res.status} ${res.statusText}</span>
         <div class="meta">${ms} ms · ${text.length} chars · ${ct || 'no content-type'}</div>`;

      /* Parse JSON */
      let parsed = null;
      try { parsed = JSON.parse(text); } catch (_) {}

      if (parsed) {
        fillSummary(parsed);
        document.getElementById('res-summary').style.display = 'block';

        /* Display JSON, truncating long base64 */
        const display = structuredClone ? structuredClone(parsed) : JSON.parse(JSON.stringify(parsed));
        if (typeof display.generated_image_base64 === 'string' && display.generated_image_base64.length > 100) {
          display.generated_image_base64 = `[${display.generated_image_base64.length} chars — hidden]`;
        }
        document.getElementById('res-json').textContent = JSON.stringify(display, null, 2);
      } else {
        document.getElementById('res-json').textContent = text || '(empty response)';
      }

    } catch (err) {
      document.getElementById('res-status').innerHTML =
        `<span class="badge err">FETCH ERROR</span>`;
      document.getElementById('res-json').textContent = err.message;
    } finally {
      btn.disabled = false;
      btn.classList.remove('loading');
    }
  }

  /* ── Fill summary panel ── */
  function fillSummary(body) {
    const d  = body.design || {};
    const pv = d.patient_view  || {};
    const dv = d.doctor_view   || {};
    const sa = d.current_smile_assessment || {};

    setText('r-style',    d.design_style                              || '—');
    setText('r-score',    sa.overall_score != null ? sa.overall_score + '/10' : '—');
    setText('r-color',    sa.color_grade                              || '—');
    setText('r-price',    pv.estimated_price_range                    || '—');
    setText('r-services', (pv.recommended_services  || []).join(', ') || '—');
    setText('r-doctors',  (dv.recommended_specialists || []).join(', ')|| '—');
    setText('r-duration', dv.treatment_duration                       || '—');

    /* Generated image: only trust base64 if substantial (>= 500 chars) */
    const raw   = body.generated_image_base64;
    const clean = typeof raw === 'string' ? raw.replace(/\s/g, '') : '';

    if (clean.length >= 500) {
      const src = `data:image/png;base64,${clean}`;
      document.getElementById('gen-img').src = src;
      document.getElementById('res-image').style.display = 'block';
    } else {
      document.getElementById('res-image').style.display = 'none';
    }
  }

  function setText(id, val) {
    document.getElementById(id).textContent = val;
  }
</script>
</body>
</html>
